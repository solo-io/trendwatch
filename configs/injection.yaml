# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
frontendPolicies:
  tracing:
    host: localhost:4317
    randomSampling: true
llm:
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://localhost:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this
mcp:
  port: 3000
  targets:
  - name: trends
    stdio:
      cmd: .venv/bin/python3
      args: ["./mcp-servers/trends_server.py"]
      env:
        TRENDS_FIXTURES: "1"
  - name: workspace
    stdio:
      cmd: .venv/bin/python3
      args: ["./mcp-servers/workspace_server.py"]
  - name: publish
    stdio:
      cmd: .venv/bin/python3
      args: ["./mcp-servers/publish_server.py"]